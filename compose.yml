# Local development infrastructure.
# Start: docker compose up -d · Status: docker compose ps · Stop: docker compose down
# Ports are bound to 127.0.0.1 only, so services with weak dev passwords are not exposed to the local network.

services:
  postgres:
    image: postgres:18.7
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432" # host port comes from .env, 5432 by default
    volumes:
      - postgres_data:/var/lib/postgresql # since 18 the mount point is one level above /data
    healthcheck:
      # $$ makes the shell inside the container expand the variable, not Compose when parsing the file
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.12.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.4.1-management
    restart: unless-stopped
    # RabbitMQ stores data in a directory named after the hostname.
    # Without a fixed hostname, a recreated container starts with an empty data directory.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672" # AMQP: the API and the worker connect here
      - "127.0.0.1:15672:15672" # management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s # slow to boot; failures in the first 20 seconds don't count

  # S3-compatible object storage. MinIO no longer publishes images on Docker Hub, so RustFS is used instead.
  # The app talks to it through the AWS SDK, so the server can be swapped without code changes.
  rustfs:
    image: rustfs/rustfs:1.0.6
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # web console: /rustfs/console/
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.34.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP: the app sends emails here
      - "127.0.0.1:8025:8025" # web UI with captured emails
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  rustfs_data:
